<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="AI 工作台账">
  <!-- 机器人账房：固定品牌色，不受 currentColor 影响 -->
  <!-- 天线 -->
  <circle cx="16" cy="3" r="1.6" fill="#C9A227"/>
  <path d="M16 5v2" stroke="#3B5BDB" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 头部 -->
  <rect x="6" y="7" width="20" height="13" rx="4" fill="#3B5BDB"/>
  <!-- 双眼 -->
  <circle cx="12" cy="12.5" r="2.1" fill="#FFFFFF"/>
  <circle cx="20" cy="12.5" r="2.1" fill="#FFFFFF"/>
  <!-- 勾形嘴 -->
  <path d="M13 16.5l2 2 4-4" fill="none" stroke="#7FE3C4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 账页双行 -->
  <path d="M9 24h14M9 27.5h9" stroke="#3B5BDB" stroke-width="1.6" stroke-opacity="0.55" stroke-linecap="round"/>
</svg>
